<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – EduGenie AI Learning Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.12), transparent 60%), var(--bg-app);
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; margin: 0 auto 1rem;">
          <i data-lucide="sparkles"></i>
        </div>
        <h2>Create Scholar Account</h2>
        <p class="text-muted" style="font-size: 0.88rem; margin-top: 0.35rem;">Unlock personalized AI tutoring, RAG, and progress tracking</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name</label>
          <input type="text" id="register-name" class="form-input" placeholder="Alex Morgan" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input type="email" id="register-email" class="form-input" placeholder="alex@university.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <input type="password" id="register-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary w-100" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
          <i data-lucide="user-plus"></i> Register Account
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-muted" style="font-size: 0.88rem;">
          Already have an account? <a href="/login" class="text-primary font-weight-bold">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
